name: food_delivery_clone
description: Food delivery app inspired by the provided design (Delight in Every Bite). Multi-language (AR/EN), themable, with animations, comparison, catalog, and rich UX.
publish_to: 'none'
version: 1.0.0+1
environment:
  sdk: '>=3.0.0 <4.0.0'
dependencies:
  flutter:
    sdk: flutter
  google_fonts: ^6.1.0
  shared_preferences: ^2.2.2
  iconly: ^1.0.1
  animations: ^2.0.8
  flutter_localizations:
    sdk: flutter
dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^2.0.0
flutter:
  uses-material-design: true
